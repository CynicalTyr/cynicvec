[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cynicvec"
version = "0.1.0"
description = "ANN cache with a shrink-guard save so a dual-write cannot wipe RAG while SQL still has rows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CynicalTyr" }]
keywords = ["vector-search", "ann", "rag", "dual-write", "sqlite-vec", "turbovec"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = []
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CynicalTyr/cynicvec"
Issues = "https://github.com/CynicalTyr/cynicvec/issues"

[tool.setuptools]
py-modules = ["cynicvec"]
